<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bb70b" />
      <stop offset="100%" stop-color="#6e9406" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd44" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.12" />

  <!-- Main Financial Graphic -->
  <g filter="url(#shadow)">
    <!-- Base Wallet / Piggy Silhouette / Safe Card -->
    <rect x="116" y="166" width="280" height="190" rx="28" fill="#ffffff" />
    <path d="M116 220 L396 220" stroke="#82af07" stroke-width="12" />
    
    <!-- Gold Coin in Front -->
    <circle cx="296" cy="256" r="56" fill="url(#coinGrad)" stroke="#d97706" stroke-width="6" />
    <text x="296" y="278" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#78350f" text-anchor="middle">$</text>
    
    <!-- Growth Arrow / Trend -->
    <path d="M166 290 L216 240 L250 264 L290 216" fill="none" stroke="#82af07" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M276 216 L294 216 L294 234" fill="none" stroke="#82af07" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Text at Bottom -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">ECONOMIAS</text>
</svg>
